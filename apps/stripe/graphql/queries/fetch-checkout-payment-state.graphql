query FetchCheckoutPaymentState($checkoutId: ID!) {
  checkout(id: $checkoutId) {
    id
    channel {
      id
    }
    totalPrice {
      gross {
        amount
        currency
      }
    }
    transactions {
      id
      pspReference
      chargedAmount {
        amount
        currency
      }
      authorizedAmount {
        amount
        currency
      }
      chargePendingAmount {
        amount
        currency
      }
      authorizePendingAmount {
        amount
        currency
      }
      # Money that moved and went back: after a full refund or a cancel the amounts above
      # are 0, but Saleor still recorded the payment (see hasRecordedMoneyMovement).
      refundedAmount {
        amount
        currency
      }
      refundPendingAmount {
        amount
        currency
      }
      canceledAmount {
        amount
        currency
      }
      cancelPendingAmount {
        amount
        currency
      }
      # A CHARGE_BACK lowers chargedAmount and has no amount field of its own.
      events {
        type
      }
    }
  }
}
