query GetRecentOrders($first: Int!, $after: String, $channel: String) {
  orders(
    first: $first
    after: $after
    channel: $channel
    sortBy: { field: CREATED_AT, direction: DESC }
  ) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      node {
        id
        number
        created
        status
        user {
          id
          email
          firstName
          lastName
        }
      }
    }
  }
}
